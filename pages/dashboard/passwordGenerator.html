<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../../styles/pages/passwordGenerator.css" />
    <link rel="stylesheet" href="../../styles/main-header.css" />
    <link rel="stylesheet" href="../../styles/sidebar.css" />
    <link rel="stylesheet" href="../../styles/general.css" />
    <link rel="stylesheet" href="../../styles/footer.css" />
    <link rel="icon" type="image/png" href="../../favicon-16x16.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Elms+Sans:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Geist:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      rel="stylesheet"
    />
    <title>Password Generator - DigitalEase</title>
  </head>

  <body>
    <div id="main-header"></div>
    <div id="sidebar"></div>

    <main>
      <section class="generator-card">
        <h1>Password Generator</h1>

        <p class="description">
          Generate strong passwords to protect your accounts from unauthorized
          access.
        </p>

        <div class="password-display">
          <span id="generatedPass"></span>

          <button id="copyBtn">
            <span class="material-symbols-outlined">content_copy</span>
          </button>
        </div>

        <div class="settings">
          <div class="setting">
            <label for="length">Password Length</label>

            <input
              type="number"
              id="length"
              class="length"
              min="8"
              max="64"
              value="16"
            />
          </div>

          <div class="setting checkbox-setting">
            <input type="checkbox" id="savePass" />

            <label for="savePass">Keep in my vault</label>
          </div>

          <button id="generateBtn">Generate Password</button>
        </div>
      </section>
    </main>

    <script type="module" src="../../components/main-header.js"></script>
    <script type="module" src="../../components/sidebar.js"></script>
    <script type="module" src="../../scripts/passwordGenerator.js"></script>
  </body>
</html>
